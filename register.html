  <title>Client Registration | Intake Sanctuary | Mindful Paths — Mental Health Counseling & Psychological Wellness</title>

  <meta property="og:title" content="Client Registration | Intake Sanctuary | Mindful Paths">

  <!-- Early Theme & Direction Persistence Handler -->
  <script>
    (function() {
      var t = localStorage.getItem('mindfulpaths_theme') || localStorage.getItem('calmind_theme') || localStorage.getItem('serenemind_theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      var d = localStorage.getItem('mindfulpaths_direction') || localStorage.getItem('calmind_direction') || localStorage.getItem('serenemind_direction');
      if (d === 'rtl') {
        document.documentElement.setAttribute('dir', 'rtl');
      } else {
        document.documentElement.setAttribute('dir', 'ltr');
      }
    })();
  </script>

</head>
<body class="bg-[#F7F5EF] text-[#26332D] dark:bg-[#131f18] dark:text-[#F7F5EF] transition-colors duration-300 min-h-screen flex flex-col justify-between overflow-x-hidden">

  <section class="min-h-screen flex items-center justify-center p-6 bg-[#F7F5EF] dark:bg-[#131f18]">
    <div class="w-full max-w-lg bg-white dark:bg-[#1a2b22] p-8 sm:p-10 rounded-3xl border border-[#E8EFE9] dark:border-white/10 shadow-2xl space-y-6">
      
      <div class="flex items-center justify-between">
        <a href="index.html" class="text-xs font-bold text-[#26332D] dark:text-[#7d8d96] hover:text-[#8FAF9A] flex items-center gap-1.5 transition-colors">
          <i class="fas fa-arrow-left"></i> Home
        </a>
        <a href="login.html" class="text-xs font-bold text-[#8FAF9A] hover:underline">Already registered? Log In</a>
      </div>

      <div class="space-y-1">
        <span class="text-xs font-bold uppercase tracking-wider text-[#8FAF9A]">New Client Intake</span>
        <h1 class="font-heading text-2xl sm:text-3xl font-bold text-[#29483A] dark:text-[#F7F5EF]">Create Your Sanctuary Account</h1>
        <p class="text-xs text-[#26332D] dark:text-[#7d8d96]">HIPAA-compliant client profile registration. Only registered accounts can access the client dashboard.</p>
      </div>

      <!-- Inline Alert Banner -->
      <div id="register-alert" class="hidden p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all"></div>

      <form id="register-form" class="space-y-4 text-xs" novalidate>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-[#29483A] dark:text-[#E8EFE9] mb-1">Full Legal Name *</label>
            <input type="text" id="reg-name" required placeholder="e.g. Rachel Adams" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F7F5EF] dark:bg-[#23382d] border border-[#E8EFE9] dark:border-white/10 text-xs text-[#29483A] dark:text-[#F7F5EF] focus:outline-none focus:border-[#8FAF9A]">
          </div>
          <div>
            <label class="block font-bold text-[#29483A] dark:text-[#E8EFE9] mb-1">Preferred Name</label>
            <input type="text" id="reg-preferred-name" placeholder="e.g. Rae" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F7F5EF] dark:bg-[#23382d] border border-[#E8EFE9] dark:border-white/10 text-xs text-[#29483A] dark:text-[#F7F5EF] focus:outline-none focus:border-[#8FAF9A]">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-[#29483A] dark:text-[#E8EFE9] mb-1">Email Address *</label>
            <input type="email" id="reg-email" required placeholder="name@example.com" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F7F5EF] dark:bg-[#23382d] border border-[#E8EFE9] dark:border-white/10 text-xs text-[#29483A] dark:text-[#F7F5EF] focus:outline-none focus:border-[#8FAF9A]">
          </div>
          <div>
            <label class="block font-bold text-[#29483A] dark:text-[#E8EFE9] mb-1">Phone Number</label>
            <input type="tel" id="reg-phone" placeholder="(555) 000-0000" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F7F5EF] dark:bg-[#23382d] border border-[#E8EFE9] dark:border-white/10 text-xs text-[#29483A] dark:text-[#F7F5EF] focus:outline-none focus:border-[#8FAF9A]">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-[#29483A] dark:text-[#E8EFE9] mb-1">Create Password * (min. 6 chars)</label>
            <div class="relative">
              <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 pr-9 rounded-xl bg-[#F7F5EF] dark:bg-[#23382d] border border-[#E8EFE9] dark:border-white/10 text-xs text-[#29483A] dark:text-[#F7F5EF] focus:outline-none focus:border-[#8FAF9A]">
              <button type="button" id="toggle-reg-password" class="absolute right-2.5 top-2 text-[#26332D]/60 dark:text-[#7d8d96]/60 hover:text-[#8FAF9A] p-1" title="Toggle password visibility">
                <i class="far fa-eye" id="reg-pass-eye"></i>
              </button>
            </div>
          </div>
          <div>
            <label class="block font-bold text-[#29483A] dark:text-[#E8EFE9] mb-1">Confirm Password *</label>
            <div class="relative">
              <input type="password" id="reg-confirm-password" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 pr-9 rounded-xl bg-[#F7F5EF] dark:bg-[#23382d] border border-[#E8EFE9] dark:border-white/10 text-xs text-[#29483A] dark:text-[#F7F5EF] focus:outline-none focus:border-[#8FAF9A]">
              <button type="button" id="toggle-reg-confirm-password" class="absolute right-2.5 top-2 text-[#26332D]/60 dark:text-[#7d8d96]/60 hover:text-[#8FAF9A] p-1" title="Toggle confirm password visibility">
                <i class="far fa-eye" id="reg-confirm-pass-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <div>
          <label class="block font-bold text-[#29483A] dark:text-[#E8EFE9] mb-1">What focus area are you seeking support for?</label>
          <select id="reg-focus" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F7F5EF] dark:bg-[#23382d] border border-[#E8EFE9] dark:border-white/10 text-xs text-[#29483A] dark:text-[#F7F5EF] focus:outline-none focus:border-[#8FAF9A]">
            <option value="anxiety">Stress, Anxiety &amp; Panic</option>
            <option value="couples">Relationship &amp; Couples Counseling</option>
            <option value="trauma">Trauma Recovery &amp; EMDR</option>
            <option value="teen">Teen &amp; Adolescent Counseling</option>
            <option value="transitions">Life Transitions &amp; Burnout</option>
          </select>
        </div>

        <div class="flex items-start gap-2 pt-1">
          <input type="checkbox" id="reg-consent" required class="mt-0.5 rounded text-[#8FAF9A] focus:ring-0">
          <label for="reg-consent" class="text-[11px] text-[#26332D] dark:text-[#7d8d96] cursor-pointer">
            I consent to confidential electronic communication and HIPAA medical privacy terms.
          </label>
        </div>

        <button type="submit" id="reg-submit-btn" class="w-full py-3.5 rounded-full bg-[#29483A] hover:bg-[#1f372c] text-white font-bold text-xs shadow-md transition-all hover:scale-[1.01] active:scale-95 flex items-center justify-center gap-2">
          <span>Create Account &amp; Proceed to Login</span>
          <i class="fas fa-arrow-right text-[10px]"></i>
        </button>
      </form>
    </div>
  </section>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const alertEl = document.getElementById('register-alert');
      const form = document.getElementById('register-form');
      const passInput = document.getElementById('reg-password');
      const confirmInput = document.getElementById('reg-confirm-password');

      function showAlert(msg, type = 'error') {
        if (!alertEl) return;
        alertEl.className = 'p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all';
        if (type === 'error') {
          alertEl.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200', 'dark:bg-red-950/40', 'dark:text-red-300', 'dark:border-red-800/50');
          alertEl.innerHTML = '<i class="fas fa-exclamation-circle text-red-500"></i> <span>' + msg + '</span>';
        } else {
          alertEl.classList.add('bg-emerald-50', 'text-emerald-800', 'border', 'border-emerald-200', 'dark:bg-emerald-950/40', 'dark:text-emerald-300', 'dark:border-emerald-800/50');
          alertEl.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i> <span>' + msg + '</span>';
        }
        alertEl.classList.remove('hidden');
      }

      function hideAlert() {
        if (alertEl) alertEl.classList.add('hidden');
      }

      // Password toggles
      const togglePass = document.getElementById('toggle-reg-password');
      const passEye = document.getElementById('reg-pass-eye');
      if (togglePass && passInput && passEye) {
        togglePass.addEventListener('click', () => {
          const isPass = passInput.getAttribute('type') === 'password';
          passInput.setAttribute('type', isPass ? 'text' : 'password');
          passEye.classList.toggle('fa-eye', !isPass);
          passEye.classList.toggle('fa-eye-slash', isPass);
        });
      }

      const toggleConfirm = document.getElementById('toggle-reg-confirm-password');
      const confirmEye = document.getElementById('reg-confirm-pass-eye');
      if (toggleConfirm && confirmInput && confirmEye) {
        toggleConfirm.addEventListener('click', () => {
          const isPass = confirmInput.getAttribute('type') === 'password';
          confirmInput.setAttribute('type', isPass ? 'text' : 'password');
          confirmEye.classList.toggle('fa-eye', !isPass);
          confirmEye.classList.toggle('fa-eye-slash', isPass);
        });
      }

      // Submit registration
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          hideAlert();

          const name = (document.getElementById('reg-name').value || '').trim();
          const preferredName = (document.getElementById('reg-preferred-name').value || '').trim();
          const email = (document.getElementById('reg-email').value || '').trim();
          const phone = (document.getElementById('reg-phone').value || '').trim();
          const password = passInput.value || '';
          const confirmPassword = confirmInput.value || '';
          const focusArea = document.getElementById('reg-focus').value;
          const consent = document.getElementById('reg-consent').checked;

          if (!name) {
            showAlert('Please enter your full legal name.', 'error');
            document.getElementById('reg-name').focus();
            return;
          }

          if (!email || !email.includes('@') || !email.includes('.')) {
            showAlert('Please enter a valid email address.', 'error');
            document.getElementById('reg-email').focus();
            return;
          }

          if (!password) {
            showAlert('Please create a password.', 'error');
            passInput.focus();
            return;
          }

          if (password.length < 6) {
            showAlert('Password must be at least 6 characters long.', 'error');
            passInput.focus();
            return;
          }

          if (password !== confirmPassword) {
            showAlert('Passwords do not match. Please re-enter your password.', 'error');
            confirmInput.focus();
            return;
          }

          if (!consent) {
            showAlert('Please check the box to agree to the HIPAA medical privacy terms.', 'error');
            return;
          }

          const registerResult = MindfulAuth.register({
            name,
            preferredName,
            email,
            password,
            phone,
            focusArea,
            role: 'client'
          });

          if (!registerResult.success) {
            showAlert(registerResult.error, 'error');
            if (window.showToast) window.showToast(registerResult.error, 'error');
            return;
          }

          showAlert('Account registered successfully! Redirecting to login...', 'success');
          if (window.showToast) window.showToast('Account registered! Redirecting to login...', 'success');

          const submitBtn = document.getElementById('reg-submit-btn');
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Redirecting to Sign In...</span>';
          }

          setTimeout(() => {
            window.location.href = 'login.html?registered=true&email=' + encodeURIComponent(email);
          }, 800);
        });
      }
    });
  </script>
</body>
